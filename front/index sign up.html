   <script src="js/bootstrap.bundle.min.js"></script>
   
   <script>
   // Simple localStorage helper
   const LS = {
     get: (k) => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
     set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
   };
   
   // Generate a mentor ID on signup page load
   function generateMentorId() {
     const bytes = new Uint32Array(1);
     window.crypto.getRandomValues(bytes);
     return (bytes[0] % 9000 + 1000).toString();
   }
   
   const mentorId = generateMentorId();
   document.getElementById('mentor-id').textContent = mentorId;
   
   // Generate unique hash for EA
   function generateHash() {
     let s = '';
     const chars = 'abcdef0123456789';
     for(let i = 0; i < 32; i++) {
       s += chars[Math.floor(Math.random() * chars.length)];
     }
     return s;
   }
   
   // Initialize default data for this new mentor
   function initMentorData() {
     const keyBase = `ev_`;
     // Check if this mentor already has data
     if(!LS.get(keyBase + 'eas_' + mentorId)) {
       // Create default EA
       const defaultEa = {
         id: 1,
         mentor: mentorId,
         name: "PRECISION SCALPER AI",
         hash: generateHash(),
         symbols: ["XAUUSD", "NAS100", "EURUSD"]
       };
       LS.set(keyBase + 'eas_' + mentorId, [defaultEa]);
       
       // Create default licence key
       const defaultKey = {
         id: 1,
         mentor: mentorId,
         user_name: "Demo User",
         key_value: "EAV-" + Math.random().toString(36).substring(2,6).toUpperCase() + "-" + Math.floor(1000+Math.random()*9000) + "-" + Math.floor(1000+Math.random()*9000),
         ea_name: "PRECISION SCALPER AI",
         status: "Active",
         created: new Date().toISOString().split('T')[0],
         expires: new Date(Date.now() + 31536000000).toISOString().split('T')[0],
         plan: "365 days plan",
         in_use: false
       };
       LS.set(keyBase + 'keys_' + mentorId, [defaultKey]);
       
       // Initialize empty copy trades
       LS.set(keyBase + 'copy_trades_' + mentorId, []);
     }
   }
   
   // Auto-save profile data from sign-up form to localStorage
   function autoSaveProfile() {
     const firstName = document.getElementById('fullname').value.trim();
     const displayName = document.getElementById('displayname').value.trim();
     const email = document.getElementById('email').value.trim();
     const phone = document.getElementById('whatsapp').value.trim();
     
     if(firstName || displayName || email || phone) {
       const profile = {
         firstname: firstName || "Mentor",
         display: displayName || "Admin",
         email: email || "",
         phone: phone || "",
         photo: null
       };
       LS.set('ev_profile_' + mentorId, profile);
     }
   }
   
   // Auto-save on input change
   document.addEventListener('DOMContentLoaded', function() {
     initMentorData();
     
     // Setup auto-save on form field changes
     const formFields = ['fullname', 'displayname', 'email', 'whatsapp'];
     formFields.forEach(fieldId => {
       const field = document.getElementById(fieldId);
       if(field) {
         field.addEventListener('input', autoSaveProfile);
       }
     });
   });
   
   // Handle form submission with AJAX
   document.getElementById('signupForm').addEventListener('submit', function(e) {
     e.preventDefault();
     
     const btn = document.getElementById('login');
     btn.classList.add('loading');
     btn.value = 'Creating Account...';
     btn.disabled = true;
     
     // Build form data
     const formData = new FormData(this);
     
     // Save profile data to localStorage BEFORE sending to server
     const firstName = document.getElementById('fullname').value.trim();
     const displayName = document.getElementById('displayname').value.trim();
     const email = document.getElementById('email').value.trim();
     const phone = document.getElementById('whatsapp').value.trim();
     
     const profile = {
       firstname: firstName || "Mentor",
       display: displayName || "Admin",
       email: email || "",
       phone: phone || "",
       photo: null
     };
     LS.set('ev_profile_' + mentorId, profile);
     
     fetch('../user_request.php', {
       method: 'POST',
       body: formData
     })
     .then(response => {
       return response.json();
     })
     .then(data => {
       btn.classList.remove('loading');
       btn.value = 'Create Account';
       btn.disabled = false;
       if (data && data.success) {
         alert(data.message);
         // Pass mentor ID to sign-in page
         window.location.href = '../sign in/index sign in.html?mentor=' + mentorId;
       } else {
         alert(data ? data.message : 'Registration failed. Please try again.');
       }
     })
     .catch(error => {
       console.error('Signup error:', error);
       btn.classList.remove('loading');
       btn.value = 'Create Account';
       btn.disabled = false;
       // Fallback: show success and redirect anyway for demo purposes
       alert('Account created! (Demo mode - Mentor ID: ' + mentorId + ')' );
       window.location.href = '../sign in/index sign in.html?mentor=' + mentorId;
     });
   });
     
     // Add focus animation to inputs
     document.querySelectorAll('.form-control').forEach((input, index) => {
       input.addEventListener('focus', function() {
         this.parentElement.style.transform = 'scale(1.02)';
         
         // Update progress indicator
         const dots = document.querySelectorAll('.progress-dot');
         const progressIndex = Math.min(Math.floor(index / 3), 2);
         dots.forEach((dot, i) => {
           if (i <= progressIndex) {
             dot.classList.add('active');
           }
         });
       });
       
       input.addEventListener('blur', function() {
         this.parentElement.style.transform = 'scale(1)';
       });
     });
   </script>
