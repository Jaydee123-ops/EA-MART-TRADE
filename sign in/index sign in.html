  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="assets/eaconvlogo.png">
  <!-- Bootstrap icons-->
  <link href="css/bootstrap-icons.css" rel="stylesheet">
  <!-- Google fonts-->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #1a1a1a 0%, #000000 50%, #1a1a1a 100%);
      font-family: 'Mulish', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(220, 53, 69, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(220, 53, 69, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(220, 53, 69, 0.03) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      pointer-events: none;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(30px, -30px); }
      66% { transform: translate(-20px, 20px); }
    }
    
    .login-card {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      max-width: 1000px;
      width: 90%;
      margin: 20px;
      animation: slideUp 0.6s ease-out;
      position: relative;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .login-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px 0 0 20px;
    }
    
    .image-side {
      background: linear-gradient(135deg, #000000 0%, #dc3545 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    
    .image-side::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: rotate 30s linear infinite;
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .image-side img {
      max-width: 80%;
      height: auto;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .card-body {
      padding: 50px 40px;
    }
    
    .brand-wrapper {
      margin-bottom: 30px;
      text-align: center;
    }
    
    .logo {
      font-family: 'Newsreader', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: #dc3545;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #dc3545 0%, #8b0000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .brand-subtitle {
      font-family: 'Kanit', sans-serif;
      font-size: 1.1rem;
      color: #6c757d;
      font-style: italic;
      margin: 0;
    }
    
    .login-card-description {
      font-family: 'Kanit', sans-serif;
      font-size: 1.5rem;
      color: #e0e0e0;
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
    }
    
    .back-to-site {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 25px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .back-to-site:hover {
      color: #dc3545;
      background: rgba(220, 53, 69, 0.1);
      border-color: #dc3545;
      text-decoration: none;
      transform: translateX(-5px);
    }
    
    .back-to-site i {
      transition: transform 0.3s ease;
    }
    
    .back-to-site:hover i {
      transform: translateX(-3px);
    }
    
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }
    
    .form-control {
      border: 2px solid #444;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      color: #e0e0e0;
      transition: all 0.3s ease;
      background: rgba(40, 40, 40, 0.8);
    }
    
    .form-control:focus {
      border-color: #dc3545;
      box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.2);
      outline: none;
      background: #2a2a2a;
      transform: translateY(-2px);
    }
    
    .form-control::placeholder {
      color: #888;
    }
    
    .login-btn {
      background: linear-gradient(135deg, #000000 0%, #dc3545 100%);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 600;
      font-size: 1.1rem;
      color: white;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    }
    
    .login-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .login-btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(220, 53, 69, 0.4);
    }
    
    .login-btn:active {
      transform: translateY(-1px) scale(0.98);
    }
    
    .forgot-password-link {
      color: #dc3545;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .forgot-password-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: #dc3545;
      transition: width 0.3s ease;
    }
    
    .forgot-password-link:hover {
      color: #ff6b6b;
      text-decoration: none;
    }
    
    .forgot-password-link:hover::after {
      width: 100%;
    }
    
    .login-card-footer-text {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .login-card-footer-text a {
      color: #dc3545;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .login-card-footer-text a:hover {
      color: #ff6b6b;
      text-decoration: underline;
    }
    
    .login-card-footer-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .login-card-footer-nav a {
      color: #aaa;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .login-card-footer-nav a:hover {
      color: #dc3545;
    }
    
    @media (max-width: 768px) {
      .login-card {
        margin: 10px;
      }
      
      .card-body {
        padding: 30px 20px;
      }
      
      .logo {
        font-size: 2rem;
      }
      
      .login-card-description {
        font-size: 1.3rem;
      }
      
      .image-side {
        display: none;
      }
    }
    
    /* Loading animation for button */
    .login-btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }
    
    .login-btn.loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      top: 50%;
      right: 20px;
      margin-top: -8px;
      border: 2px solid #ffffff;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="d-flex align-items-center min-vh-100 py-3 py-md-0">
    <div class="container">
      <div class="card login-card">
        <div class="row no-gutters">
          <div class="col-md-5 image-side">
            <img src="images/adminlogo.png" alt="EA SMART TRADE Logo" class="login-card-img">
          </div>
          <div class="col-md-7">
            <div class="card-body">
              <a href="/" class="back-to-site">
                <i class="bi bi-arrow-left"></i>
                Back to Site
              </a>
              
              <div class="brand-wrapper">
                <h1 class="logo">Mentor</h1>
                <p class="brand-subtitle">Admin Dashboard</p>
              </div>
              
              <p class="login-card-description">Sign in to your account</p>
              
              <form action="login.php" method="post" id="loginForm">
                <div class="form-group">
                  <label for="email" class="sr-only">Email</label>
                  <input type="email" name="email" id="email" class="form-control" placeholder="Email address" required="">
                </div>
                <div class="form-group mb-4">
                  <label for="password" class="sr-only">Password</label>
                  <input type="password" name="password" id="password" class="form-control" placeholder="Password" required="">
                </div>
                
                <input name="login" id="login" class="btn btn-block login-btn" type="submit" value="Sign In">

              <a href="forgot-password.php" class="forgot-password-link">Forgot password?</a>
              <p class="login-card-footer-text">Don't have an account? <a href="../front/index sign up.html">Sign Up</a></p>
              
              <nav class="login-card-footer-nav">
                <a href="#!">Terms of use</a>
                <a href="#!">Privacy policy</a>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  
      <script>
      // Simple localStorage helper
      const LS = {
        get: (k) => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
        set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
      };
      
      // Store mentor ID in localStorage
      function storeMentorId(mentorId) {
        if(mentorId) localStorage.setItem('ev_mentor_id', mentorId);
      }
      
      // If URL has mentor param, store it (e.g., coming from sign-up)
      const urlParams = new URLSearchParams(window.location.search);
      const urlMentor = urlParams.get('mentor');
      if(urlMentor) {
        storeMentorId(urlMentor);
      }
      
      // Form submission
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('login').classList.add('loading');
        document.getElementById('login').value = 'Signing in...';
        
        const formData = new FormData(this);
        
        fetch('login.php', {
          method: 'POST',
          body: formData
        })
        .then(response => response.json())
        .then(data => {
          if (data && data.success) {
            // Use mentor_id from response, or fallback to stored
            const mentorId = data.mentor_id || LS.get('ev_mentor_id') || String(Math.floor(Math.random() * 9000) + 1000);
            storeMentorId(mentorId);
            window.location.href = '../index dashboard.html?mentor=' + mentorId;
          } else {
            // Demo mode if login fails
            console.log('Login API unavailable, using demo redirect');
            const mentorId = LS.get('ev_mentor_id') || String(Math.floor(Math.random() * 9000) + 1000);
            storeMentorId(mentorId);
            window.location.href = '../index dashboard.html?mentor=' + mentorId;
          }
        })
        .catch(error => {
          console.log('Login service unavailable, using demo redirect:', error);
          const mentorId = LS.get('ev_mentor_id') || String(Math.floor(Math.random() * 9000) + 1000);
          storeMentorId(mentorId);
          window.location.href = '../index dashboard.html?mentor=' + mentorId;
        });
      });
      
      // Add focus animation to inputs
      document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('focus', function() {
          this.parentElement.style.transform = 'scale(1.02)';
        });
        input.addEventListener('blur', function() {
          this.parentElement.style.transform = 'scale(1)';
        });
      });
    </script>

</body></html>
